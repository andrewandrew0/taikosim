<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TJA Player</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- ═══════ SONG SELECT MENU ═══════ -->
    <div id="menu-screen" class="screen">
        <header class="menu-header">
            <h1 class="app-title">🥁 TJA Player</h1>
            <p class="app-subtitle">Cycle songs with <kbd>D</kbd> / <kbd>K</kbd> • Press <kbd>F</kbd> / <kbd>J</kbd> to Select</p>
            <div class="header-actions">
                <button class="btn-folder" id="btn-refresh" title="Rescan songs directory for new entries">
                    🔄 Refresh Songs
                </button>
                <label class="btn-folder" title="Open a local folder containing .tja and audio files">
                    📁 Open Local Song Folder
                    <input type="file" id="folder-input" webkitdirectory directory multiple style="display:none;">
                </label>
            </div>
        </header>

        <!-- Current Song Details Hero Panel -->
        <div id="selected-song-hero" class="song-hero">
            <div class="hero-title" id="hero-title">Loading songs...</div>
            <div class="hero-subtitle" id="hero-subtitle"></div>
            <div class="hero-meta">
                <span class="bpm-badge" id="hero-bpm">-- BPM</span>
                <span class="courses-preview" id="hero-courses"></span>
            </div>
        </div>

        <!-- Vertical Song Bars Carousel -->
        <div class="carousel-container">
            <button class="nav-arrow left-arrow" id="btn-prev" title="Previous (D)">◀</button>
            <div id="song-carousel" class="song-carousel"></div>
            <button class="nav-arrow right-arrow" id="btn-next" title="Next (K)">▶</button>
        </div>

        <footer class="menu-footer">
            <span class="key-hint"><kbd>D</kbd> <kbd>K</kbd> = Previous / Next Song</span>
            <span class="key-hint"><kbd>F</kbd> <kbd>J</kbd> = Choose Song</span>
        </footer>

        <!-- ═══════ DIFFICULTY CHOICE MODAL ═══════ -->
        <div id="difficulty-modal" class="modal-overlay hidden">
            <div class="difficulty-dialog">
                <div class="dialog-header">
                    <div class="dialog-label">CHOOSE DIFFICULTY</div>
                    <h2 class="dialog-title" id="dialog-song-title">Song Title</h2>
                    <div class="dialog-subtitle" id="dialog-song-subtitle">Artist</div>
                </div>

                <div id="difficulty-cards-container" class="difficulty-cards">
                    <!-- Vertical difficulty cards rendered here -->
                </div>

                <div class="modal-footer">
                    <span class="key-hint"><kbd>D</kbd> <kbd>K</kbd> = Cycle Difficulty</span>
                    <span class="key-hint"><kbd>F</kbd> <kbd>J</kbd> = Start Song</span>
                    <span class="key-hint"><kbd>ESC</kbd> = Back</span>
                </div>
            </div>
        </div>
    </div>

    <!-- ═══════ GAMEPLAY SCREEN ═══════ -->
    <div id="game-screen" class="screen hidden">
        <canvas id="game-canvas"></canvas>
    </div>

    <!-- ═══════ LOADING OVERLAY ═══════ -->
    <div id="loading-overlay" class="hidden">
        <div class="loading-spinner"></div>
        <div class="loading-text">Loading...</div>
    </div>

    <!-- Scripts -->
    <script src="js/sound-manager.js"></script>
    <script src="js/tja-parser.js"></script>
    <script src="js/game.js"></script>
    <script src="songs-data.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
